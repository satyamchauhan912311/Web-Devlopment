<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <fieldset>

            <h2>Event Registration</h2>
            <br>
            <br>

            <label for="name1">Name:</label> <br>
            <input type="text" id="name1">
            <br>
            <br>
            <label for="email1">Email:</label> <br>
            <input type="email" id="email1">
            <br>
            <br>
            <label for="phone1">Phone:</label> <br>
            <input type="tel" id="phone1">
            <br>
            <br>

            <label for="occ">Occupation:</label> <br>
            <select name="Occupation" id="occ">
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
            <br>
            <br>

            <p>Topic of interest:</p> 

            <input type="checkbox" name="checkbox" id="check1"> <br>
            <label for="check1">HTML</label>
            <br>
            <input type="checkbox" name="checkbox" id="check2"> <br>
            <label for="check2">CSS</label>
            <br>
            <input type="checkbox" name="checkbox" id="check3"> <br>
            <label for="check3">JAVASCRIPT</label>
            <br>
            <br>
            <label for="textA">Comments:</label> <br>
            <textarea name="textarea1" id="textA" ></textarea>
            <br>
            <br>
            <button>Register</button>
        </fieldset>
    </form>
    
</body>
</html>
